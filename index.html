<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="随心，日常随笔。">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
  <title>随心</title>
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="./assets/vendor/marked.umd.js" defer></script>
  <script src="./assets/vendor/purify.min.js" defer></script>
  <script src="./assets/core.js" defer></script>
  <script src="./assets/app.js" defer></script>
</head>
<body data-view="index" data-loading="true">
  <a class="skip-link" id="skip-link" href="#index-title">跳到主要内容</a>
  <header class="site-header">
    <div class="header-inner page-column">
      <a class="site-brand" href="#" aria-label="随心，回到首页">随心</a>
      <a class="search-link" id="open-search" href="#index" aria-controls="index-toolbar" aria-expanded="false" aria-keyshortcuts="/">搜索</a>
    </div>
  </header>
  <nav class="breadcrumbs page-column" aria-label="面包屑导航"><ol id="breadcrumbs"><li><span aria-current="page">首页</span></li></ol></nav>
  <main class="index-view page-column" id="index-view" aria-labelledby="index-title">
    <h1 class="page-title" id="index-title" tabindex="-1">文章</h1>
    <div class="index-toolbar" id="index-toolbar" role="search" hidden>
      <label for="search">标题或正文</label>
      <div class="search-controls">
        <div class="index-search">
          <input id="search" type="search" placeholder="输入关键词" autocomplete="off" spellcheck="false" aria-controls="note-list">
        </div>
        <button class="text-button" id="clear-search" type="button" hidden>清空</button>
        <button class="text-button" id="close-search" type="button">收起</button>
      </div>
    </div>
    <p class="result-count" id="result-count" role="status" hidden></p>
    <div class="load-feedback" id="load-feedback">
      <div class="load-status">
        <span class="error-symbol" id="load-error-symbol" aria-hidden="true" hidden>!</span>
        <p id="load-status" role="status">正在加载文章…</p>
      </div>
      <button class="text-button primary" id="load-retry" type="button" hidden>重新加载</button>
    </div>
    <ol class="note-list" id="note-list"></ol>
    <div class="empty-state" id="search-empty" hidden>
      <p>暂时没有找到这段文字。</p>
      <button class="text-button" id="empty-clear" type="button">清空搜索，看看全部</button>
    </div>
  </main>
  <main class="reading-view page-column" id="reading-view" hidden aria-labelledby="article-title">
    <article class="article" id="article" tabindex="-1" aria-labelledby="article-title">
      <header class="article-header">
        <h1 id="article-title"></h1>
      </header>
      <div class="markdown-body" id="article-body"></div>
    </article>
    <nav class="article-navigation" id="article-navigation" aria-label="前后篇"></nav>
  </main>
  <main class="message-view page-column" id="message-view" hidden aria-labelledby="message-title">
    <h1 id="message-title" tabindex="-1"></h1>
    <p class="load-status">
      <span class="error-symbol" id="message-error-symbol" aria-hidden="true" hidden>!</span>
      <span id="message-copy"></span>
    </p>
    <button class="text-button primary" id="message-retry" type="button" hidden>重新加载</button>
  </main>
  <p class="sr-only" id="navigation-status" role="status" aria-live="polite"></p>
  <noscript><p class="noscript-message">请启用浏览器的 JavaScript，以查看文章列表和阅读文字。</p></noscript>
</body>
</html>
